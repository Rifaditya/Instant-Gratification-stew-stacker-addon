plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "net.dasik.social:dasik-library:${project.dasik_library_version}"
    implementation "net.instantgratification:stack-size-adjuster:1.4.19+26.1.2"

    // Optional GUI Dependencies (compile-only required, runtime-optional for players)
    compileOnly "dev.isxander:yet-another-config-lib:3.9.5+26.2-fabric"
    runtimeOnly "dev.isxander:yet-another-config-lib:3.9.5+26.2-fabric"
    compileOnly "com.terraformersmc:modmenu:18.0.0-beta.1"
    runtimeOnly "com.terraformersmc:modmenu:18.0.0-beta.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_dependency", project.minecraft_dependency
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version,
               "minecraft_dependency": project.minecraft_dependency
    }
}

loom {
    mixin {
        defaultRefmapName = "stew-stacker-refmap.json"
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes(
            'Specification-Title': project.mod_name,
            'Specification-Vendor': 'Dasik (Rifaditya)',
            'Specification-Version': project.mod_version,
            'Implementation-Title': project.archives_base_name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor': 'Dasik (Rifaditya)',
            'X-Origin-Author': 'Dasik (Rifaditya)',
            'X-Origin-Repository': 'https://github.com/Rifaditya',
            'X-Origin-License': 'GNU GPLv3'
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Copies release JAR to all 4 deployment locations'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (jarFile.exists()) {
                    // Point 1: Mod Local Archive (Archive Jar of all versions/MC <version>)
                    def mcVer = project.findProperty('minecraft_version') ?: ''
                    def localArchiveDir = file(mcVer ? "../Archive Jar of all versions/MC ${mcVer}" : "../Archive Jar of all versions")
                    localArchiveDir.mkdirs()
                    copy {
                        from jarFile
                        into localArchiveDir
                    }
                    println "[DEPLOY-POINT-1] Copied ${jarFile.name} to local Archive: ${localArchiveDir.canonicalPath}"

                    // Point 2: Central Release Hub Archives
                    File hubCandidate = projectDir
                    File hubDir = null
                    while (hubCandidate != null) {
                        File checkDir = new File(hubCandidate, "minecraft-mod-release-hub")
                        if (checkDir.exists()) {
                            hubDir = checkDir
                            break
                        }
                        hubCandidate = hubCandidate.parentFile
                    }
                    if (hubDir == null) {
                        File fallback = new File("E:/Minecraft Project/minecraft-mod-release-hub")
                        if (fallback.exists()) hubDir = fallback
                    }
                    if (hubDir != null && hubDir.exists()) {
                        File targetHubDir = new File(hubDir, "archives/Stew Stacker Addon")
                        targetHubDir.mkdirs()
                        copy {
                            from jarFile
                            into targetHubDir
                        }
                        println "[DEPLOY-POINT-2] Copied ${jarFile.name} to release hub: ${targetHubDir.canonicalPath}"
                    }

                    // Point 3: External Vault Archive
                    File vaultDir = new File("D:/Minecraft Mod Archive Jars/Stew Stacker Addon")
                    if (vaultDir.exists() || vaultDir.parentFile?.exists()) {
                        vaultDir.mkdirs()
                        copy {
                            from jarFile
                            into vaultDir
                        }
                        println "[DEPLOY-POINT-3] Copied ${jarFile.name} to external vault: ${vaultDir.canonicalPath}"
                    }

                    // Point 4: Modrinth App Profile mods directory
                    File profileDir = new File("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.1.2/mods")
                    if (profileDir.exists()) {
                        profileDir.listFiles().each { file ->
                            if (file.name.startsWith(project.archives_base_name) && file.name.endsWith(".jar") && !file.name.equals(jarFile.name)) {
                                file.delete()
                                println "[DEPLOY-POINT-4] Purged old version from test profile: ${file.name}"
                            }
                        }
                        copy {
                            from jarFile
                            into profileDir
                        }
                        println "[DEPLOY-POINT-4] Deployed ${jarFile.name} to test profile: ${profileDir.canonicalPath}"
                    }
                }
            }
        }
        build.finalizedBy(archiveTask)
    }
}
